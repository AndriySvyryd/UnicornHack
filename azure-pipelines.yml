# .NET Core pipeline
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/languages/dotnet-core?view=azure-devops

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: '**/*.Tests/*.csproj'
    arguments: '--configuration $(buildConfiguration) --collect "Code coverage"'

- task: DotNetCoreCLI@2
  displayName: 'Benchmark Core'
  inputs:
    command: 'run'
    arguments: '--configuration $(buildConfiguration) --no-build --project test\UnicornHack.Core.PerformanceTests\UnicornHack.Core.PerformanceTests.csproj -- --artifacts $(Build.ArtifactStagingDirectory)\CoreBenchmarks'

- task: DotNetCoreCLI@2
  displayName: 'Benchmark Web'
  inputs:
    command: 'run'
    arguments: '--configuration $(buildConfiguration) --no-build --project test\UnicornHack.Web.PerformanceTests\UnicornHack.Web.PerformanceTests.csproj -- --artifacts $(Build.ArtifactStagingDirectory)\WebBenchmarks'

- task: PowerShell@2
  displayName: 'Check Performance Thresholds'
  inputs:
    filePath: 'test\Test-PerformanceThresholds.ps1'
    arguments: '-CoreResultsPath "$(Build.ArtifactStagingDirectory)\CoreBenchmarks" -WebResultsPath "$(Build.ArtifactStagingDirectory)\WebBenchmarks"'
    pwsh: true

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: true
    modifyOutputPath: true
    zipAfterPublish: true
    arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Upload Artifacts'
